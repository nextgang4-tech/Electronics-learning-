name: Build AI Electronics Guru Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-extract ZIP if uploaded
        shell: bash
        run: |
          if [ ! -f "app/build.gradle.kts" ] && [ -f "AI_Electronics_Guru_Pro.zip" ]; then
            echo "Extracting AI_Electronics_Guru_Pro.zip..."
            unzip -o AI_Electronics_Guru_Pro.zip -d .
          fi
          if [ -f "app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          elif [ -f "AI_Electronics_Guru_Pro/app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=AI_Electronics_Guru_Pro" >> $GITHUB_ENV
          else
            echo "ERROR: AI_Electronics_Guru_Pro.zip ya app/build.gradle.kts nahi mila!"
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: gradle -p "${{ env.PROJECT_DIR }}" assembleDebug --stacktrace --no-daemon

      - name: Upload app-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Electronics-Guru-Pro-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
